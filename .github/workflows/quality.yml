name: Quality Checks

on:
  pull_request:
  push:
    branches:
      - main
      - master
      - new_architekt

jobs:
  quality:
    runs-on: ubuntu-latest
    env:
      # Safe dummy values for CI test/runtime init. Real secrets are not needed here.
      VITE_SUPABASE_URL: https://ci-placeholder.supabase.co
      VITE_SUPABASE_ANON_KEY: e30.eyJyb2xlIjoiYW5vbiJ9.c2lnbmF0dXJl

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Audit root dependencies
        run: npm audit --audit-level=high

      - name: Verify root registry signatures
        run: npm audit signatures

      - name: Run test suite
        run: npm run test:run

      - name: Run TypeScript typecheck
        run: npm run typecheck

      - name: Check documentation links
        run: npm run check:docs

      - name: Check import boundaries
        run: npm run check:boundaries
        env:
          LEGACY_IMPORT_BASELINE_REF: ${{ github.event.pull_request.base.sha || github.event.before }}

      - name: Check legacy structure freeze
        run: npm run check:legacy-structure

      - name: Check architecture graph
        if: ${{ (github.event_name != 'pull_request' || github.base_ref != 'main' || github.head_ref != 'new_architekt' || github.event.pull_request.head.repo.full_name != github.repository) && (github.event_name != 'push' || github.ref != 'refs/heads/main') }}
        run: npm run check:architecture-graph
        env:
          ARCHITECTURE_GRAPH_BASELINE_REF: ${{ github.event.pull_request.base.sha || github.event.before }}

      - name: Check architecture graph for final integration
        if: ${{ github.event_name == 'pull_request' && github.base_ref == 'main' && github.head_ref == 'new_architekt' && github.event.pull_request.head.repo.full_name == github.repository }}
        run: npm run check:architecture-graph -- --final-integration
        env:
          ARCHITECTURE_GRAPH_BASELINE_REF: ${{ github.event.pull_request.base.sha }}

      - name: Check architecture graph after main integration
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        run: npm run check:architecture-graph -- --post-merge-integration
        env:
          ARCHITECTURE_GRAPH_BASELINE_REF: ${{ github.event.before }}

      - name: Smoke build (web)
        run: npm run build

      - name: Install desktop dependencies from lockfile
        run: npm ci --prefix desktop --ignore-scripts

      - name: Smoke compile (desktop)
        run: npm run desktop:compile

      - name: Audit desktop dependencies
        run: npm audit --prefix desktop --audit-level=high

      - name: Verify desktop registry signatures
        run: npm audit signatures --prefix desktop
