name: Desktop Artifacts

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  windows:
    name: Windows installer
    runs-on: windows-latest
    env:
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
      VITE_GOOGLE_OAUTH_CLIENT_ID_DESKTOP: ${{ secrets.VITE_GOOGLE_OAUTH_CLIENT_ID_DESKTOP }}
      VITE_MICROSOFT_TENANT_ID: f84a89a3-e428-4deb-8c95-a2b2decfb656
      VITE_MICROSOFT_OAUTH_CLIENT_ID: df0e80c8-ac5e-4733-8ee1-7dae0ba09802

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: "npm"

      - name: Validate build configuration
        shell: pwsh
        run: |
          if (-not $env:VITE_SUPABASE_URL) { throw "Missing GitHub secret VITE_SUPABASE_URL" }
          if (-not $env:VITE_SUPABASE_ANON_KEY) { throw "Missing GitHub secret VITE_SUPABASE_ANON_KEY" }
          if (-not $env:VITE_MICROSOFT_TENANT_ID) { throw "Missing VITE_MICROSOFT_TENANT_ID" }
          if (-not $env:VITE_MICROSOFT_OAUTH_CLIENT_ID) { throw "Missing VITE_MICROSOFT_OAUTH_CLIENT_ID" }

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm run test:run

      - name: Check import boundaries
        run: npm run check:boundaries

      - name: Check legacy structure freeze
        run: npm run check:legacy-structure

      - name: Build Windows desktop app
        run: npm run desktop:build:win

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: tender-flow-windows-${{ github.ref_name }}
          path: |
            dist-electron/*.exe
            dist-electron/latest.yml
            dist-electron/*.blockmap
          if-no-files-found: error
