      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Tender Flow je česká platforma pro přípravu a vedení staveb. Propojuje poptávky, výběrová řízení, nabídky subdodavatelů, smlouvy, projektové dokumenty a harmonogram. Je určena stavebním firmám, přípravářům, stavbyvedoucím, projektovým manažerům a kalkulantům."

      "@type": "Question",
      "name": "Kolik stojí Tender Flow a jak získám ukázku?",

        "@type": "Answer",
        "text": "Tender Flow nabízíme jako firemní licenci Enterprise s individuální cenou podle počtu licencí a dohodnutého období. Platba probíhá bankovním převodem na základě faktury. Ukázku a podmínky přístupu domluvíte na martin@tenderflow.cz."
      }
    },
    {
      "@type": "Question",
      "name": "Jak funguje AI čtení smluv a ochrana dokumentů?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Mistral AI pomáhá přečíst naskenované smlouvy a objednávky a získat klíčové údaje. Výsledky před uložením kontroluje uživatel. Pro podporovaná API používáme Zero Data Retention: vstupy a výstupy se u Mistralu neuchovávají déle, než je nutné k odpovědi. Tento režim nemaže dokumenty uložené v Tender Flow a nevztahuje se automaticky na připojené AI klienty. Nastavení trénování modelů je samostatné."
      }
    },
    {
      "@type": "Question",
      "name": "Co umožňuje vlastní MCP server?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Kompatibilní AI klient může s udělenými oprávněními číst projektové údaje, nabídky a smluvní přehledy. Podporované změny, například vytvoření úkolu nebo úprava stavu či ceny nabídky, vyžadují přípravu návrhu, potvrzení a provedení. Přístup lze odvolat. E-mail a kalendář vyžadují vlastní konektory klienta a mají vlastní pravidla ochrany dat."
      }
    },

      "@type": "Question",
      "name": "Co zahrnuje TODO Osobní a propojení s Microsoft To Do?",

        "@type": "Answer",

      }
    },

      "@type": "Question",
      "name": "Je Tender Flow dostupný na webu a desktopu? Funguje offline?",

        "@type": "Answer",

      "@type": "Question",

        <header>
          <h1>Tender Flow — Platforma přípravy a vedení staveb</h1>
          <p>
            Česká platforma pro přípravu a vedení staveb od první poptávky
            přes výběrová řízení a subdodavatelské nabídky až po smlouvy,
            harmonogram a dokumentaci stavby. Stavební tendry, AI analýza
            smluv, Složkomat a Ganttův harmonogram v jednom nástroji.
            Dostupná jako webová i nativní desktopová aplikace pro Windows
            a macOS.
          </p>
          <p>
            <a href="mailto:martin@tenderflow.cz">Domluvit ukázku</a> ·
            <a href="/login">Přihlásit se</a> ·
            <a href="mailto:info@tenderflow.cz">info@tenderflow.cz</a>
          </p>
        </header>

        <section>
          <h2>Funkce pro stavební firmy</h2>
          <h3>Inteligentní pipeline tendrů</h3>
          <p>
            Vizuální Kanban board se sledováním fází, automatickými
            notifikacemi a deadliny. Vidíte přesně kde jsou vaše nabídky
            v reálném čase: nové, v nabídce, ve vyjednávání, vyhrané nebo
            prohrané. Přehled win rate a objemu v Kč.
          </p>
          <h3>OCR čtení objednávek a smluv</h3>
          <p>
            Pomocí AI je zajištěno automatické čtení naskenovaných dokumentů
            pro získání parametrů. Buduje přehled o parametrech subdodávek
            pro stavbu. Úspora času oproti ručnímu pročítání smluv
            a objednávek.
          </p>
          <h3>CRM kontakty</h3>
          <p>
            360° pohled na subdodavatele — historie spolupráce, hodnocení,
            nabídky, kontaktní osoby. Automatické doplnění informací
            o dodavateli z veřejně dostupných českých rejstříků podle IČ.
          </p>
          <h3>Složkomat (dokumentový hub)</h3>
          <p>
            Centralizované dokumenty s automaticky generovanou standardizovanou
            strukturou. Podporuje Google Drive, OneDrive i lokální disk.
          </p>
          <h3>Harmonogram</h3>
          <p>
            Ganttův diagram s milníky, závislostmi mezi úkoly a týmovou
            kolaborací v reálném čase.
          </p>
          <h3>TODO Osobní</h3>
          <p>Osobní seznamy, projekty, podúkoly, termíny a připomínky. Volitelné propojení s Microsoft To Do synchronizuje podporované údaje ve spárovaných seznamech.</p>
          <h3>Excel nástroje</h3>
          <p>
            Merge více listů do jednoho souboru a unlock uzamčených listů —
            navrženo pro kalkulanty pracující s daty od subdodavatelů.
          </p>
        </section>

        <section>
          <h2>Platforma — navrženo pro stavební profesionály</h2>
          <ul>
            <li><strong>Neomezené projekty</strong> — spravujte celé portfolio z jednoho místa.</li>
            <li><strong>Real-time synchronizace</strong> — váš tým vidí změny okamžitě.</li>
            <li><strong>Export jedním klikem</strong> — PDF, Excel, CSV pro vaše reporty.</li>
            <li><strong>Desktop i web</strong> — nativní aplikace pro Windows a macOS plus plnohodnotná webová verze.</li>
            <li><strong>Přístupová práva</strong> — účet, organizace, role, sdílení projektu a databázová pravidla Row Level Security.</li>
          </ul>
        </section>

        <section>
          <h2>Firemní licence Enterprise</h2>
          <p>Cenu připravíme podle potřeb vašeho týmu. Platba probíhá bankovním převodem na základě faktury.</p>
          <p><a href="mailto:martin@tenderflow.cz">Domluvit nabídku</a></p>
        </section>
        <section>
          <h2>Mistral AI a Zero Data Retention</h2>
          <p>Mistral AI zpracovává dokumenty přes API. ZDR máme aktivované: u podporovaných požadavků neuchovává vstupy a výstupy déle, než je nutné k vytvoření odpovědi.</p>
          <p>ZDR se nevztahuje na všechny služby poskytovatele a neodstraňuje dokumenty uložené v TenderFlow. Nastavení trénování modelů je samostatné.</p>
          <h2>Vlastní MCP server TenderFlow</h2>
          <p>Propojte kompatibilního AI klienta s projekty, nabídkami a úkoly. Přístup schvalujete vy, změny procházejí přípravou, potvrzením a provedením.</p>
          <p>Server: https://www.tenderflow.cz/api/mcp. Podrobnosti najdete v <a href="/user-manual/">uživatelské dokumentaci</a>.</p>
        </section>

        <section>
          <h2>Pro koho je Tender Flow</h2>
          <p>
            Platforma přípravy a vedení staveb pro české a slovenské
            stavební firmy, generální dodavatele, přípraváře staveb,
            projektové manažery, stavbyvedoucí a kalkulanty. Funguje pro
            jednotlivce, malé týmy i velké organizace.
          </p>
        </section>

        <section>
          <h2>Firemní reference</h2>
          <p><a href="https://www.baustav.cz/cs/">BAU-STAV a.s.</a> — stavební společnost, Karlovy Vary.</p>
        </section>

        <section>
          <h2>Časté otázky</h2>
          <h3>Co je Tender Flow?</h3>
          <p>Tender Flow je česká platforma pro přípravu a vedení staveb. Propojuje poptávky, výběrová řízení, nabídky subdodavatelů, smlouvy, projektové dokumenty a harmonogram. Je určena stavebním firmám, přípravářům, stavbyvedoucím, projektovým manažerům a kalkulantům.</p>
          <h3>Kolik stojí Tender Flow a jak získám ukázku?</h3>
          <p>Tender Flow nabízíme jako firemní licenci Enterprise s individuální cenou podle počtu licencí a dohodnutého období. Platba probíhá bankovním převodem na základě faktury. Ukázku a podmínky přístupu domluvíte na martin@tenderflow.cz.</p>
          <h3>Jak funguje AI čtení smluv a ochrana dokumentů?</h3>
          <p>Mistral AI pomáhá přečíst naskenované smlouvy a objednávky a získat klíčové údaje. Výsledky před uložením kontroluje uživatel. Pro podporovaná API používáme Zero Data Retention: vstupy a výstupy se u Mistralu neuchovávají déle, než je nutné k odpovědi. Tento režim nemaže dokumenty uložené v Tender Flow a nevztahuje se automaticky na připojené AI klienty. Nastavení trénování modelů je samostatné.</p>
          <h3>Co umožňuje vlastní MCP server?</h3>
          <p>Kompatibilní AI klient může s udělenými oprávněními číst projektové údaje, nabídky a smluvní přehledy. Podporované změny, například vytvoření úkolu nebo úprava stavu či ceny nabídky, vyžadují přípravu návrhu, potvrzení a provedení. Přístup lze odvolat. E-mail a kalendář vyžadují vlastní konektory klienta a mají vlastní pravidla ochrany dat.</p>
          <h3>Co zahrnuje TODO Osobní a propojení s Microsoft To Do?</h3>
          <p>TODO Osobní nabízí seznamy, projekty, podúkoly, termíny a připomínky. Volitelné propojení s Microsoft To Do synchronizuje podporované údaje ve spárovaných seznamech obousměrně. Přílohy, opakování a ostatní osobní seznamy Microsoft To Do se touto integrací nepřenášejí.</p>
          <h3>Je Tender Flow dostupný na webu a desktopu? Funguje offline?</h3>
          <p>Tender Flow je dostupný jako webová aplikace a desktopová aplikace pro Windows a macOS. Přihlášení, ověření licence, sdílená data, synchronizace a AI služby vyžadují připojení k internetu. Některé lokální nástroje pracují se soubory v počítači; nejde o plný offline režim celé aplikace.</p>
          <h3>Jaké podklady lze v projektu evidovat a exportovat?</h3>
          <p>Projekt propojuje plán výběrových řízení, nabídky, smlouvy, dodatky, fakturaci, dokumenty a harmonogram. Přehled stavby lze exportovat do Excelu. Další exporty a lokální nástroje jsou dostupné podle konkrétního modulu, platformy a oprávnění.</p>
          <h3>Jak jsou řízena přístupová práva?</h3>
          <p>Přístup k projektovým datům se řídí účtem, organizací, rolí a sdílením projektu. Databázová pravidla Row Level Security omezují přístup k záznamům. Podmínky zpracování dat popisují zásady ochrany osobních údajů a zpracovatelská doložka DPA. Dostupnost funkcí závisí také na licenci a konfiguraci.</p>
